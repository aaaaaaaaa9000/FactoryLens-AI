# Replace factorylens (e.g. content-verifier) and factorylens.aaaaaaaaa9000.cloud (e.g. sadaq.aaaaaaaaa9000.cloud).
# Add/remove environment lines to match what the app's server actually reads.
services:
  app:
    build: .
    container_name: ai-app-factorylens
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - APP_USERNAME=${APP_USERNAME:-user}
      - APP_PASSWORD=${APP_PASSWORD}
      - SESSION_DAYS=${SESSION_DAYS:-180}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS:-1000}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-factorylens.rule=Host(`${APP_DOMAIN:-factorylens.aaaaaaaaa9000.cloud}`)"
      - "traefik.http.routers.ai-factorylens.entrypoints=websecure"
      - "traefik.http.routers.ai-factorylens.tls=true"
      - "traefik.http.routers.ai-factorylens.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-factorylens.loadbalancer.server.port=3000"
      - "traefik.docker.network=automation-stack_automation-network"

networks:
  default:
    name: automation-stack_automation-network
    external: true
